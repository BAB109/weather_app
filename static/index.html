<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #6c63ff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #5548e8;
        }

        .result {
            margin-top: 25px;
        }

        .result p {
            margin: 10px 0;
            font-size: 18px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🌤 Weather App</h1>

        <input id="city" placeholder="Enter City">
        <input id="country_code" placeholder="Country Code (e.g., IN)">
        <input id="state" placeholder="state (e.g.,Telangana )">
        <button id="b">Get Weather</button>

        <div class="result">
            <p id="temp"></p>
            <p id="humidity"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
